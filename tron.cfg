# TRON: three images (build.sh puts them on the disc, LOADER puts them in place):
#   TRON    main RAM $0800-$187F (LOADER loads it high and moves it down): the
#           interrupt, the display, the drawing -- everything that runs while bank
#           4 (map, tiles) is paged in, or in an interrupt.  Below $1880: a Model B's
#           screen starts there (hw.inc), and the Master's shadow RAM is at $3000+.
#           $0D00 is the NMI's RTI (the MOS's NMI vector).
#   CODEB   the code bank ($9200 on, after the explosion's frames and the font):
#           the game's logic, the text, the sound, the start-up
#   CODEA   bank 4's spare room: code and tables that read the map
MEMORY {
    ZP:    start = $0000, size = $00F0, type = rw;
    LOW:   start = $0400, size = $0400, type = rw;
    MAIN:  start = $0800, size = $1080, type = rw, file = %O, fill = yes;
    BANKB: start = $9200, size = $2E00, type = rw, file = "build/CODEB";
    BANKA: start = $B400, size = $0200, type = rw, file = "build/CODEA";
    TABA:  start = $BF50, size = $00B0, type = rw, file = "build/TABA";
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = LOW,   type = bss, define = yes;
    LOWX:     load = MAIN,  type = rw;
    NMI:      load = MAIN,  type = rw, start = $0D00;
    CODE:     load = MAIN,  type = rw;
    CODEB:    load = BANKB, type = rw;
    CODEA:    load = BANKA, type = rw;
    TABA:     load = TABA,  type = rw;
}
