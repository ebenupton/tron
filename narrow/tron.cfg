# TRON: loaded at $4400 by LOADER, which moves it down (Master 128, or Model B
# with 16K of sideways RAM; the MOS is dropped once the game has the machine).
#   CODE    $0E00-$2FFF: nothing the game runs or reads may be at $3000 or above,
#           where the Master's shadow RAM replaces main RAM while W1 is drawn
#   LOWX    code and tables run at $0800-$0CFF (after the variables, below the
#           NMI's RTI at $0D00): their image follows CODE in the file, and LOADER
#           moves it straight there (so the Model B's explosion frames at $3300,
#           already loaded, are not touched)
MEMORY {
    ZP:    start = $0000, size = $00F0, type = rw;
    LOW:   start = $0400, size = $0400, type = rw;
    LOWR:  start = $0800, size = $0500, type = rw;
    MAIN:  start = $0E00, size = $2200, type = rw, file = %O, fill = yes;
    IMG:   start = $3000, size = $0500, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = LOW,  type = bss, define = yes;
    CODE:     load = MAIN, type = rw;
    LOWX:     load = IMG,  run = LOWR, type = rw, define = yes;
}
